name: Release (PyPI)

# CI runs on Forgejo (.forgejo/workflows/ci.yml). Publishing runs here on
# GitHub because PyPI Trusted Publishing (OIDC) is configured for the GitHub
# repo — the vxug->GitHub push mirror carries the version tag, which fires this
# workflow. No API token is stored; the `pypi` environment + `id-token: write`
# authorize the upload.
#
# To cut a release: bump the version, then `git tag v0.2.2 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # manylinux_2_28 container so the abi3 wheel is PyPI-acceptable; the
      # before-script builds the emry CLI into python/emry/_bin/ so it's bundled
      # in the wheel (cmake + perl are needed for the rustls/aws-lc-rs build).
      - name: Build wheel (CLI binary bundled)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist
          manylinux: "2_28"
          before-script-linux: |
            dnf install -y cmake perl || yum install -y cmake perl
            bash scripts/build-cli.sh

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: dist/*
