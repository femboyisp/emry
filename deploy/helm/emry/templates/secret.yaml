{{- /*
Create a Secret holding the dashboard auth token only when the user supplied an
inline token AND did not point at their own existing Secret.
*/ -}}
{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "emry.fullname" .) }}
  labels:
    {{- include "emry.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}
