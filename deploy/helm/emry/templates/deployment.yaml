apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "emry.fullname" . }}
  labels:
    {{- include "emry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "emry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "emry.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "emry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Serve the multi-run project dashboard over the mounted logs volume.
          # `emry web` takes the log directory via `--project <PATH>` (there is
          # no separate --log-dir flag for the web subcommand).
          args:
            - "web"
            - "--project"
            - {{ .Values.logsMountPath | quote }}
            - "--port"
            - {{ .Values.service.port | quote }}
            # Bind all interfaces so the kubelet probes and Service (which reach
            # the pod IP, not loopback) can connect. Pair with auth.token/TLS.
            - "--host"
            - {{ .Values.host | default "0.0.0.0" | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: EMRY_PROJECT
              value: {{ .Values.projectName | quote }}
            {{- if or .Values.auth.token .Values.auth.existingSecret }}
            # Dashboard auth token (EMRY-061) sourced from a Secret.
            - name: EMRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "emry.authSecretName" . }}
                  key: {{ include "emry.authSecretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.logsMountPath }}
              {{- if .Values.logs.existingClaim }}
              readOnly: true
              {{- end }}
            {{- if index .Values.securityContext "readOnlyRootFilesystem" }}
            # Writable scratch for a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: logs
          {{- if .Values.logs.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.logs.existingClaim }}
          {{- else if .Values.logs.hostPath }}
          hostPath:
            path: {{ .Values.logs.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {{ .Values.logs.emptyDir | toYaml | nindent 12 }}
          {{- end }}
        {{- if index .Values.securityContext "readOnlyRootFilesystem" }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
