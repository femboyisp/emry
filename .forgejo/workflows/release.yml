name: Release

# Builds the sdist + manylinux abi3 wheel and publishes to PyPI when a version
# tag is pushed. Publishing uses PyPI Trusted Publishing (OIDC) — no API token
# is stored; the `pypi` environment + `id-token: write` authorize the upload.
#
# To cut a release: bump the version, then `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # `token:` is REQUIRED on Forgejo. setup-* downloads toolchains from GitHub's release
          # assets and authenticates with GITHUB_TOKEN, which here is a FORGEJO token — github.com
          # rejects it with `HttpClientError: Bad credentials`, and the job dies with
          # `Version <x> was not found in the local cache`. GH_COM_TOKEN is a real github.com PAT
          # (org-level secret; named GH_COM_* because Forgejo refuses secret names starting GITHUB_).
          token: ${{ secrets.GH_COM_TOKEN }}
          python-version: "3.12"

      # maturin-action builds inside a manylinux container so the abi3 wheel is
      # PyPI-acceptable (a bare `maturin build` would emit a linux_x86_64 wheel
      # that PyPI rejects). before-script-linux runs IN the container so the
      # bundled `emry` binary links against the same (old) glibc as the wheel.
      # manylinux_2_28 has a modern-enough toolchain to build rustls/aws-lc-rs
      # (emry-cli -> emry-web); cmake + perl are needed for the aws-lc build.
      - name: Build wheel (CLI binary bundled)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist
          manylinux: "2_28"
          before-script-linux: |
            dnf install -y cmake perl || yum install -y cmake perl
            bash scripts/build-cli.sh

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - uses: forgejo/upload-artifact@v4 # v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: write # create the GitHub Release
    steps:
      - uses: forgejo/download-artifact@v4 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Idempotent: skip files already on PyPI (e.g. a re-run after a
          # partial upload) instead of failing the job.
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: dist/*
